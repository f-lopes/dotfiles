[tools]
java = ["corretto-17", "corretto-21", "corretto-25"]
maven = "3.9.9"
go = "1.21"
node = "26"                                       # Latest LTS line (Lithium); needed by npm: backend tools (junie-cli)
terraform = "latest"
starship = "latest"
ripgrep = "latest"
bat = "latest"
gh = "latest"
chezmoi = "latest"

# OS-level tools managed by Homebrew/OrbStack (not mise):
#   op (1password-cli) — Homebrew cask, requires macOS code-signing trust & Touch ID
#   vagrant — Homebrew cask, stable Ruby version (not experimental vagrant-go)
#   docker, docker-compose — OrbStack symlinks to /usr/local/bin on macOS

"aqua:junegunn/fzf" = "latest"
"aqua:sharkdp/fd" = "latest"
"aqua:casey/just" = "latest"
"aqua:go-task/task" = "latest"
"aqua:jesseduffield/lazygit" = "latest"
"aqua:zellij" = "latest"
"aqua:ajeetdsouza/zoxide" = "latest"
"aqua:kubernetes/kubernetes/kubectl" = "latest"
"aqua:helm/helm" = "latest"
"aqua:derailed/k9s" = "latest"
"aqua:ahmetb/kubectx" = "latest"
"aqua:mozilla/sops" = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:nojima/httpie-go" = "latest"

# Heavy/occasional dev tools
cmake = "latest"                                  # Build system generator
"aqua:kubernetes-sigs/kind" = "latest"            # Kubernetes in Docker (local clusters)
"aqua:GoogleContainerTools/skaffold" = "latest"   # Kubernetes dev workflow
"aqua:aquasecurity/trivy" = "latest"              # Container security scanning
"aqua:infracost/infracost" = "latest"             # Terraform cost estimates
"npm:@jetbrains/junie-cli" = { version = "latest", allow_low_downloads = true }  # Junie CLI
"npm:@openai/codex" = "latest"                    # Codex CLI
"github:tomasz-tomczyk/crit" = "0.23.3"           # crit; a bump re-runs run_onchange_after_40-crit-agents

[settings]
experimental = true
